name: validate-plugins

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests, translations, catalog, thumbnails
        run: python3 .github/scripts/validate_plugins.py

      - name: Luau analyze (luau-lsp)
        run: |
          npm install -g luau-lsp
          curl -sL -o noctalia.d.luau https://raw.githubusercontent.com/noctalia-dev/official-plugins/main/noctalia.d.luau
          luau-lsp analyze --definitions=noctalia.d.luau charge-mode tibber
